function prepareNormalPool(){

  if(!eligible.length) eligible=all.filter(n=>!cycleSeen.has(n));
  if(!eligible.length){

function cleanEdibilityNote(s){
  let note=(s.edibilityNote||"").trim();

  if(!note) return "";

  if(norm(note)===norm(cat)) return "";

  if(/^especie tóxica[;,. ]*(no consumir)?[.!]?$/i.test(note)) return "";
  if(/^no consumir[.!]?$/i.test(note)) return "";
  // Si la nota empieza repitiendo literalmente la categoría, conserva solo la información adicional.
  const esc=cat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  note=note.replace(new RegExp('^'+esc+'\\s*[;:,.–—-]*\\s*','i'),'').trim();

function cleanHabitatText(s,phenology){

    data=data.filter(r=>{
      const lab=String(r[0]||"").trim();
      if(/^Comestibilidad$|^Toxicidad$/i.test(lab)) return false;
      return hasValue(r[1]) && hasValue(r[2]);
    });
  }else{
    // Sin tabla fuente no inventamos equivalencias entre caracteres: ficha paralela mínima.
    const distinct=s=>{
      const vals=(s.discriminants||[]).map(x=>String(x||"").trim()).filter(Boolean);
      return vals.length ? vals.join("; ").replace(/;\s*$/,'') + "." : "Sin caracteres distintivos adicionales consignados.";
    };
    data=[["Características distintivas",distinct(a),distinct(b)]];
    const ah=cleanHabitatText(a,a.phenology), bh=cleanHabitatText(b,b.phenology);
    if(hasValue(ah)&&hasValue(bh)) data.push(["Hábitat",ah,bh]);
    if(hasValue(a.phenology)&&hasValue(b.phenology)) data.push(["Fenología",a.phenology,b.phenology]);
  }
  const edCell=s=>{const note=cleanEdibilityNote(s);return `${s.edibility||""}${note?`<br><span class="muted">${note}</span>`:""}`};
  data.push(["Comestibilidad",edCell(a),edCell(b)]);
  return data.map(([lab,av,bv])=>`<tr><td><strong>${lab}</strong></td><td>${av}</td><td>${bv}</td></tr>`).join("");
}
function showRoundSummary(pts,r){const s=species[currentName],wrong=!r.speciesOk,b=species[guessedName];const rawTotal=(r.genusOk?1:0)+(r.speciesOk?1:0)+(r.nutOk?1:0)+(r.ediOk?1:0);let review="";if(!r.genusOk||!r.speciesOk||!r.nutOk||!r.ediOk){const items=[];if(!r.genusOk||!r.speciesOk)items.push(`<li><strong>Especie:</strong> esperado ${scientific(currentName)}; tu respuesta: ${scientific(guessedName)}.</li>`);if(!r.nutOk)items.push(`<li><strong>Nutrición:</strong> esperado ${s.nutrition}; tu respuesta: ${r.nut}.</li>`);if(!r.ediOk)items.push(`<li><strong>Comestibilidad:</strong> esperado ${s.edibility}; tu respuesta: ${r.edi}.</li>`);review=`<div class="summary"><strong>Revisa:</strong><ul>${items.join("")}</ul></div>`}let detail="";if(wrong&&b){detail=`<div class="summary"><table><tr><th>Clave</th><th>${scientific(currentName)}</th><th>${scientific(guessedName)}</th></tr>${keyRows(currentName,guessedName)}</table></div>`}else{const keyData=[];const cleanHab=cleanHabitatText(s,s.phenology);if(cleanHab)keyData.push(`<strong>Hábitat / asociación:</strong> ${cleanHab}`);keyData.push(...(s.discriminants||[]));const en=cleanEdibilityNote(s);if(en)keyData.push(`<strong>Comestibilidad:</strong> ${en}`);detail=`<div class="keys"><h3>Datos clave de ${scientific(currentName)}</h3><ul>${keyData.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}document.getElementById("after").innerHTML=`<div class="summary"><h3>Corrección</h3><p><strong>Género</strong> ${r.genusOk?'✅':'❌'} &nbsp; <strong>Especie</strong> ${r.speciesOk?'✅':'❌'} &nbsp; <strong>Nutrición</strong> ${r.nutOk?'✅':'❌'} &nbsp; <strong>Comestibilidad</strong> ${r.ediOk?'✅':'❌'}</p><p><strong>Total: ${rawTotal}/4</strong></p></div>${review}${detail}<div class="scoreBox">Puntuación de esta fotografía: ${pts.toFixed(2)} / 1</div><div class="actions"><button class="primary" onclick="newRound()">${round>=roundPool.length||round>=MAX_ROUNDS?'Ver resultado final':'Siguiente fotografía'}</button><button onclick="finishGame()">Terminar partida</button></div>`;document.getElementById("answers").querySelectorAll("select,button").forEach(x=>x.disabled=true)}
function updateStats(){document.getElementById("points").textContent=totalPoints.toFixed(2);const answered=history.length;document.getElementById("grade").textContent=(answered?totalPoints/answered*10:0).toFixed(1)}
function finishGame(){
  const answered=history.length,grade=answered?totalPoints/answered*10:0;
  const errors=history.filter(x=>x.hadError);
  if(!repeatMode){
    recentPrevious=new Set(history.map(x=>x.currentName));
    lastNormalErrors=errors;
  }else{
    /* En repaso, la lista de errores se reduce en cada intento y se mantiene hasta lograr cero errores. */
    lastNormalErrors=errors;
  }
  let actions="";
  if(errors.length){
    actions=`<button class="primary" onclick="startErrorReview()">Repetir errores (${errors.length})</button><button onclick="startNormalGame()">Nueva partida</button>`;
  }else{
    actions=`<button class="primary" onclick="endSession()">Terminar partida</button>`;
  }
  document.getElementById("game").innerHTML=`<div class="feedback correct"><h2>${repeatMode?'Repaso terminado':'Partida terminada'}</h2><p>Fotografías contestadas: <strong>${answered}</strong></p><p>Puntos obtenidos: <strong>${totalPoints.toFixed(2)}</strong> / ${answered}</p><div class="scoreBox">Nota final: ${grade.toFixed(1)} / 10</div>${errors.length?`<p>Fichas con algún error: <strong>${errors.length}</strong>. Puedes repetir únicamente esas fichas hasta conseguir resolverlas sin errores.</p>`:`<p><strong>Sin errores.</strong></p>`}<div class="actions">${actions}</div></div>`
}
function endSession(){document.getElementById("game").innerHTML=`<div class="feedback correct"><h2>Partida terminada</h2><p>Repaso completado sin errores.</p></div>`}
startNormalGame();
</script>
