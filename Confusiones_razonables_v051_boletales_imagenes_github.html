/* Categorías normalizadas del Entrenador micológico. */
const NUTRITION_OPTIONS=["Saprobia","Micorrícica","Parásita","Parásita facultativa","Sapromicorrícica"];
const EDIBILITY_OPTIONS=["Comestible","Comestible previo tratamiento","Comestible previo doble tratamiento","Sin valor culinario","Tóxica","Potencialmente mortal"];
const MAX_ROUNDS=30;
let round=0,totalPoints=0,currentName=null,currentOptions=[],guessedName=null,hints=[],hintIndex=0,roundClosed=false,history=[];
/*
  Control de partidas:
  - una especie objetivo no se repite dentro de la misma partida;
  - repeatMode repasa exclusivamente las rondas con algún error;
  - recentPrevious guarda las especies de la partida anterior para evitarlas en la siguiente siempre que sea posible;
  - cycleSeen permite ir recorriendo el conjunto disponible antes de reiniciar el ciclo.
*/
let roundPool=[],repeatMode=false,repeatQueue=[],recentPrevious=new Set(),cycleSeen=new Set(),lastNormalErrors=[];
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function scientific(name){return `<em>${name}</em>`}
function valid(v){return v && v!=="PENDIENTE_FICHA"}
function candidatesBy(field,value,current,used){return Object.keys(species).filter(n=>n!==current&&!used.has(n)&&species[n][field]===value)}
function buildOptions(current){const s=species[current],used=new Set([current]),picked=[];const add=list=>{shuffle(list).forEach(n=>{if(picked.length<7&&!used.has(n)&&species[n]){picked.push(n);used.add(n)}})};add(s.confusions||[]);if(picked.length<7)add(candidatesBy("genus",s.genus,current,used));if(picked.length<7)add(candidatesBy("family",s.family,current,used));if(picked.length<7)add(candidatesBy("order",s.order,current,used));if(picked.length<7)add(Object.keys(species).filter(n=>n!==current&&!used.has(n)));return shuffle([current,...picked.slice(0,7)])}
function buildHints(s){const h=[];if(s.phenology)h.push(["Fenología",s.phenology]);if(s.habitat)h.push(["Hábitat",s.habitat]);if(s.smell)h.push(["Olor",s.smell]);if(s.taste)h.push(["Sabor",s.taste]);(s.discriminants||[]).forEach((v,i)=>{if(v)h.push([`Carácter discriminante${s.discriminants.length>1?` ${i+1}`:""}`,v])});if(s.chemicals)h.push(["Reacción a químicos",s.chemicals]);if(s.sporePrint)h.push(["Esporada",s.sporePrint]);return h}
function renderOptions(){const box=document.getElementById("options");box.innerHTML="";currentOptions.forEach(n=>{const b=document.createElement("button");b.className="optionBtn";b.innerHTML=scientific(n);b.onclick=()=>chooseSpecies(n);box.appendChild(b)})}
function prepareNormalPool(){
  const all=Object.keys(species);
  let eligible=all.filter(n=>!cycleSeen.has(n) && !recentPrevious.has(n));
  if(!eligible.length){
    eligible=all.filter(n=>!cycleSeen.has(n));
  }
  if(!eligible.length){
    cycleSeen.clear();
    eligible=all.filter(n=>!recentPrevious.has(n));
    if(!eligible.length) eligible=[...all];
  }
  return shuffle(eligible).slice(0,MAX_ROUNDS);
}
function startNormalGame(){
  repeatMode=false; repeatQueue=[]; round=0; totalPoints=0; history=[]; roundClosed=false;
  roundPool=prepareNormalPool();
  roundPool.forEach(n=>cycleSeen.add(n));
  restoreGameShell();
  newRound();
}
function startErrorReview(){
  const errors=lastNormalErrors.map(x=>x.currentName);
  repeatMode=true; repeatQueue=shuffle([...new Set(errors)]); roundPool=[...repeatQueue];
  round=0; totalPoints=0; history=[]; roundClosed=false;
  restoreGameShell();
  newRound();
}
function restoreGameShell(){
  document.getElementById("game").innerHTML=`<h2>¿Qué especie es?</h2><div id="options" class="options"></div><div class="actions"><button class="warn" id="hintBtn" onclick="giveHint()">💡 Pedir pista</button><button onclick="showAllHints()">💡 Todas las pistas</button><button onclick="finishGame()">Terminar partida</button></div><div id="hint" class="hintTrail"></div><div id="feedback"></div><div id="answers"></div><div id="after"></div>`;
}
function newRound(){
  if(round>=roundPool.length || round>=MAX_ROUNDS){finishGame();return}
  currentName=roundPool[round]; round++;
  roundClosed=false;guessedName=null;hintIndex=0;
  document.getElementById("roundNo").textContent=round;
  const totalLabel=Math.min(MAX_ROUNDS,roundPool.length);
  document.querySelector('.stats .pill:first-child').innerHTML=`Fotografía <span id="roundNo">${round}</span>/${totalLabel}${repeatMode?' · Repaso de errores':''}`;
  document.getElementById("feedback").innerHTML="";document.getElementById("answers").innerHTML="";document.getElementById("after").innerHTML="";document.getElementById("hint").innerHTML="";
  currentOptions=buildOptions(currentName);hints=buildHints(species[currentName]);document.getElementById("mainPhoto").src=species[currentName].image;renderOptions();updateStats()
}
function giveHint(){if(hintIndex>=hints.length)return;const [k,v]=hints[hintIndex++];document.getElementById("hint").innerHTML+=`<div class="hintCard"><strong>${k}</strong><br>${v}</div>`}
function showAllHints(){while(hintIndex<hints.length)giveHint()}
function chooseSpecies(name){if(guessedName)return;guessedName=name;document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);const ok=name===currentName;document.getElementById("feedback").innerHTML=`<div class="feedback ${ok?'correct':'wrong'}"><strong>${ok?'✅ Correcto':'❌ Incorrecto'}</strong><br>${ok?`Es ${scientific(currentName)}.`:`Es ${scientific(currentName)}. Has seleccionado ${scientific(name)}.`}</div>`;renderAnswerSelectors()}
function optionList(values,answer){const vals=[...new Set(values.filter(Boolean))];if(valid(answer)&&!vals.includes(answer))vals.push(answer);return `<option value="">Selecciona…</option>`+vals.map(v=>`<option value="${v.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${v}</option>`).join("")}
function renderAnswerSelectors(){const s=species[currentName];const nutritionValues=NUTRITION_OPTIONS.length?NUTRITION_OPTIONS:[...new Set(Object.values(species).map(x=>x.nutrition).filter(valid))];const edibleValues=[...new Set([...EDIBILITY_OPTIONS,...Object.values(species).map(x=>x.edibility).filter(valid)])];document.getElementById("answers").innerHTML=`<div class="answerPanel"><div class="question">Completa la identificación</div><div class="selectGrid"><label>Nutrición<select id="nutritionSelect">${optionList(nutritionValues,s.nutrition)}</select></label><label>Comestibilidad<select id="edibilitySelect">${optionList(edibleValues,s.edibility)}</select></label></div><div class="actions"><button class="primary" onclick="submitAnswers()">Comprobar</button></div></div>`}
function submitAnswers(){if(roundClosed)return;const s=species[currentName],nut=document.getElementById("nutritionSelect").value,edi=document.getElementById("edibilitySelect").value;if(!nut||!edi){alert("Selecciona nutrición y comestibilidad.");return}const targetGenus=s.genus||currentName.split(" ")[0],guessedGenus=(species[guessedName]?.genus)||guessedName.split(" ")[0];const genusOk=guessedGenus===targetGenus,speciesOk=guessedName===currentName,nutOk=valid(s.nutrition)&&nut===s.nutrition,ediOk=valid(s.edibility)&&edi===s.edibility;const idPts=(genusOk?.25:0)+(speciesOk?.25:0);const nutPts=nutOk?.25:0;const ediPts=ediOk?.25:0;const pts=idPts+nutPts+ediPts;totalPoints+=pts;roundClosed=true;const hadError=!(genusOk&&speciesOk&&nutOk&&ediOk);history.push({currentName,guessedName,nut,edi,pts,hadError});showRoundSummary(pts,{genusOk,speciesOk,nutOk,ediOk,idPts,nutPts,ediPts,nut,edi});updateStats()}
function keyRows(a,b){const fields=[["Fenología","phenology"],["Hábitat","habitat"],["Olor","smell"],["Sabor","taste"],["Reacción a químicos","chemicals"],["Esporada","sporePrint"]];let rows=fields.filter(([_,k])=>a[k]||b[k]).map(([lab,k])=>`<tr><td><strong>${lab}</strong></td><td>${a[k]||"—"}</td><td>${b[k]||"—"}</td></tr>`).join("");rows+=`<tr><td><strong>Caracteres discriminantes</strong></td><td>${(a.discriminants||[]).join("<br>")||"—"}</td><td>${(b.discriminants||[]).join("<br>")||"—"}</td></tr>`;rows+=`<tr><td><strong>Comestibilidad</strong></td><td>${a.edibility||"—"}${a.edibilityNote?`<br><span class="muted">${a.edibilityNote}</span>`:""}</td><td>${b.edibility||"—"}${b.edibilityNote?`<br><span class="muted">${b.edibilityNote}</span>`:""}</td></tr>`;return rows}
function showRoundSummary(pts,r){const s=species[currentName],wrong=!r.speciesOk,b=species[guessedName];const rawTotal=(r.genusOk?1:0)+(r.speciesOk?1:0)+(r.nutOk?1:0)+(r.ediOk?1:0);let review="";if(!r.genusOk||!r.speciesOk||!r.nutOk||!r.ediOk){const items=[];if(!r.genusOk||!r.speciesOk)items.push(`<li><strong>Especie:</strong> esperado ${scientific(currentName)}; tu respuesta: ${scientific(guessedName)}.</li>`);if(!r.nutOk)items.push(`<li><strong>Nutrición:</strong> esperado ${s.nutrition}; tu respuesta: ${r.nut}.</li>`);if(!r.ediOk)items.push(`<li><strong>Comestibilidad:</strong> esperado ${s.edibility}; tu respuesta: ${r.edi}.</li>`);review=`<div class="summary"><strong>Revisa:</strong><ul>${items.join("")}</ul></div>`}let detail="";if(wrong&&b){detail=`<div class="summary"><table><tr><th>Clave</th><th>${scientific(currentName)}</th><th>${scientific(guessedName)}</th></tr>${keyRows(s,b)}</table></div>`}else{const keyData=[...(s.discriminants||[])];if(s.edibilityNote)keyData.push(`<strong>Comestibilidad:</strong> ${s.edibilityNote}`);detail=`<div class="keys"><h3>Datos clave de ${scientific(currentName)}</h3><ul>${keyData.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}document.getElementById("after").innerHTML=`<div class="summary"><h3>Corrección</h3><p><strong>Género</strong> ${r.genusOk?'✅':'❌'} &nbsp; <strong>Especie</strong> ${r.speciesOk?'✅':'❌'} &nbsp; <strong>Nutrición</strong> ${r.nutOk?'✅':'❌'} &nbsp; <strong>Comestibilidad</strong> ${r.ediOk?'✅':'❌'}</p><p><strong>Total: ${rawTotal}/4</strong></p></div>${review}${detail}<div class="scoreBox">Puntuación de esta fotografía: ${pts.toFixed(2)} / 1</div><div class="actions"><button class="primary" onclick="newRound()">${round>=roundPool.length||round>=MAX_ROUNDS?'Ver resultado final':'Siguiente fotografía'}</button><button onclick="finishGame()">Terminar partida</button></div>`;document.getElementById("answers").querySelectorAll("select,button").forEach(x=>x.disabled=true)}
function updateStats(){document.getElementById("points").textContent=totalPoints.toFixed(2);const answered=history.length;document.getElementById("grade").textContent=(answered?totalPoints/answered*10:0).toFixed(1)}
function finishGame(){
  const answered=history.length,grade=answered?totalPoints/answered*10:0;
  const errors=history.filter(x=>x.hadError);
  if(!repeatMode){
    recentPrevious=new Set(history.map(x=>x.currentName));
    lastNormalErrors=errors;
  }else{
    /* En repaso, la lista de errores se reduce en cada intento y se mantiene hasta lograr cero errores. */
    lastNormalErrors=errors;
  }
  let actions="";
  if(errors.length){
    actions=`<button class="primary" onclick="startErrorReview()">Repetir errores (${errors.length})</button><button onclick="startNormalGame()">Nueva partida</button>`;
  }else{
    actions=`<button class="primary" onclick="endSession()">Terminar partida</button>`;
  }
  document.getElementById("game").innerHTML=`<div class="feedback correct"><h2>${repeatMode?'Repaso terminado':'Partida terminada'}</h2><p>Fotografías contestadas: <strong>${answered}</strong></p><p>Puntos obtenidos: <strong>${totalPoints.toFixed(2)}</strong> / ${answered}</p><div class="scoreBox">Nota final: ${grade.toFixed(1)} / 10</div>${errors.length?`<p>Fichas con algún error: <strong>${errors.length}</strong>. Puedes repetir únicamente esas fichas hasta conseguir resolverlas sin errores.</p>`:`<p><strong>Sin errores.</strong></p>`}<div class="actions">${actions}</div></div>`
}
function endSession(){document.getElementById("game").innerHTML=`<div class="feedback correct"><h2>Partida terminada</h2><p>Repaso completado sin errores.</p></div>`}
startNormalGame();
</script>
</body></html>
